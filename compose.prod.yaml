# Fuer die NAS: zieht das fertige Image, statt lokal zu bauen.
#   docker compose -f compose.prod.yaml up -d
services:
  willhaben-agent:
    image: ${IMAGE:-DOCKERHUB_USER/willhaben-agent}:latest
    container_name: willhaben-agent
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      TZ: Europe/Vienna
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      # Optional: setzt HTTP-Basic-Auth vor die Oberflaeche.
      UI_USER: ${UI_USER:-}
      UI_PASSWORD: ${UI_PASSWORD:-}
    volumes:
      # Ganzes Verzeichnis, nicht die einzelne Datei: die Oberflaeche schreibt
      # config.json per atomarem Rename, und das scheitert auf einem
      # Bind-Mount, der auf einer einzelnen Datei liegt.
      - ./data:/app/data
