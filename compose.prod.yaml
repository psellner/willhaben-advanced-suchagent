# Fertiges Image von Docker Hub ziehen, statt lokal zu bauen.
#   docker compose up -d
services:
  willhaben-agent:
    image: psellner1/willhaben-agent:latest
    container_name: willhaben-agent
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      TZ: Europe/Vienna
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      POLL_INTERVAL: 60
      # Leer lassen heißt: Oberfläche ohne Passwort.
      UI_USER: ${UI_USER:-}
      UI_PASSWORD: ${UI_PASSWORD:-}
    volumes:
      # Ganzes Verzeichnis, nicht die einzelne Datei: die Oberfläche schreibt
      # config.json per atomarem Rename, und das scheitert auf einem
      # Bind-Mount, der auf einer einzelnen Datei liegt.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8088/healthz"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
